[Service]
# The known Caldera event-loop freeze also hangs the normal stop path:
# force SIGKILL quickly so watchdog restarts actually complete.
TimeoutStopSec=5
# Kill any stray caldera-music left over from a hung stop before starting:
# two instances fighting over the DAC produce pure noise.
ExecStartPre=-/usr/bin/pkill -9 -x caldera-music
