[Service]
# Hard guard: the panel must never take the system (and the audio) down.
# On a 512 MB Pi 3A+ an unbounded render cache once triggered an
# OOM/swap storm that froze everything. If the panel ever exceeds the
# cap, systemd kills it and Restart=always brings it back in seconds.
MemoryHigh=150M
MemoryMax=180M
OOMScoreAdjust=500
