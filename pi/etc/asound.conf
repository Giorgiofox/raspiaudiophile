# RaspiAudiophile: Caldera -> peppyalsa meter tap -> DAC (bit-perfect via plug passthrough)
pcm_scope_type.peppyalsa {
    lib /usr/lib/libpeppyalsa.so
}
pcm_scope.peppyalsa {
    type peppyalsa
    decay_ms 60
    meter "/tmp/peppyalsa_fifo"
    meter_max 100
    meter_show 0
}
pcm.dac_meter {
    type meter
    slave.pcm "hw:sndrpihifiberry,0"
    scopes.0 peppyalsa
}
pcm.caldera_tap {
    type plug
    slave.pcm "dac_meter"
}
